		.section__1 > img {
			width: 100%;
			height: 100%;
			border-radius: 10px;
			margin: 10px 0px;
		}
		.section__1 > p {
			margin: 10px 0;
			font-size: 20px;

		.slider {
			display: flex;
			width: 100%;
			overflow: hidden;
			position: relative;
		}

		.slider > img {
			width: 100%;
			border-radius: 10px;
			transition: .3s;
		}

		.slider > i {
			position: absolute;
			top: 50%;

			color: #ffbe41;
			opacity: .7;
			font-size: 32px;
			transition: .3s;
			cursor: pointer;
			text-shadow: 2px 2px 1px #000;
		}
		.slider > i:hover{
			color: #ffbe41;
			opacity: 1;
			transform: scale(1.3);
		}

		#description > p {
			margin-top: 10px;
		}
	</style>
